services:
  - type: web
    name: fanterlinomc-guidance-claude-chatbot-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: CORS_ORIGIN
        value: https://fanterlinomc.github.io
      - key: ANTHROPIC_API_KEY
        sync: false
